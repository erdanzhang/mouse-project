# Default rig configuration. Copy and edit per machine; nothing here is secret.
capture:
  source: "file:data/sample.mp4"   # file:PATH | cam:0 | genicam:SERIAL
  fps: 60
  cameras: []                       # GenICam serial numbers, e.g. ["DA1234", "DA5678"]

sync:
  trigger: arduino                  # arduino | none (free-run)
  fps: 60

gate:
  percentile: 92                    # motion percentile kept as "active"
  roi: auto                         # auto | none
  encoder: null                     # null = auto-detect (NVENC / VideoToolbox / x265)

paths:
  outputs: outputs/
