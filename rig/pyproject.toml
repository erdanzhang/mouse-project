[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-scratch-rig"
version = "0.1.0"
description = "Multi-camera mouse nose-scratch capture + analysis rig (platform-neutral)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "erdanzhang" }]
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.7",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.4.9",   # bundled ffmpeg binary for Windows/macOS/Linux (fallback)
    "pyserial>=3.5",           # USB serial link to the Arduino trigger
]

[project.optional-dependencies]
# Real machine-vision cameras (Windows/Linux + a GenTL producer, e.g. Hikvision MVS)
capture = ["harvesters>=1.4"]
# Pose / behavior models (heavy; CUDA on the lab PC, MPS/CPU on a Mac)
models = ["torch>=2.1", "ultralytics>=8.3", "supervision>=0.22"]
dev = ["pytest>=7"]

[project.scripts]
mouse-rig = "mouse_rig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mouse_rig = ["server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
